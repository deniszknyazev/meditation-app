<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Serene" />
  <meta name="theme-color" content="#04101e" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Serene — Meditation</title>
  <link rel="stylesheet" href="styles.css?v=7" />
</head>
<body>
  <div id="app">
    <div id="screen-home"     class="screen active"></div>
    <div id="screen-breathe"  class="screen"></div>
    <div id="screen-meditate" class="screen"></div>
    <div id="screen-journal"  class="screen"></div>
    <div id="screen-progress" class="screen"></div>

    <nav id="bottom-nav">
      <!-- Home -->
      <button class="nav-btn active" data-screen="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1H5a1 1 0 01-1-1v-9.5z"/>
          <path d="M9 21V12h6v9"/>
        </svg>
        <span>Home</span>
      </button>
      <!-- Breathe: expanding rings -->
      <button class="nav-btn" data-screen="breathe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round">
          <circle cx="12" cy="12" r="2.5" stroke-width="2"/>
          <circle cx="12" cy="12" r="6"   stroke-width="1.4" stroke-dasharray="2 2"/>
          <circle cx="12" cy="12" r="10"  stroke-width="1" stroke-dasharray="1 3" opacity=".6"/>
        </svg>
        <span>Breathe</span>
      </button>
      <!-- Meditate: seated person -->
      <button class="nav-btn" data-screen="meditate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="5" r="2"/>
          <path d="M8 14c0-2.2 1.8-4 4-4s4 1.8 4 4"/>
          <path d="M5.5 17.5l2.5-2M18.5 17.5l-2.5-2"/>
          <line x1="4" y1="20" x2="20" y2="20"/>
        </svg>
        <span>Meditate</span>
      </button>
      <!-- Journal: open book -->
      <button class="nav-btn" data-screen="journal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h7v16H4z"/>
          <path d="M13 4h7v16h-7z"/>
          <line x1="8" y1="9"  x2="8"  y2="9"/>
          <line x1="8" y1="13" x2="8"  y2="13"/>
          <line x1="17" y1="9"  x2="17" y2="9"/>
          <line x1="17" y1="13" x2="17" y2="13"/>
        </svg>
        <span>Journal</span>
      </button>
      <!-- Progress: bar chart -->
      <button class="nav-btn" data-screen="progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6"  y1="20" x2="6"  y2="14"/>
          <line x1="12" y1="20" x2="12" y2="8"/>
          <line x1="18" y1="20" x2="18" y2="4"/>
          <line x1="3"  y1="20" x2="21" y2="20"/>
        </svg>
        <span>Progress</span>
      </button>
    </nav>
  </div>

  <script src="app.js?v=7"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
